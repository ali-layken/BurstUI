<!-- Wireframe panel border (styles.css .wire-frame*): a 9-slice border-image, 48x48 with 16px corners; the middle of
     each edge stretches. wire-frame-filled.svg is the same frame with the panel fill inside the inner line too - keep the
     two in sync. Gen 1 Pokemon text box style double line, with a flower in each corner instead of its knobs.
     Lilac = the ocean's sky colour, orange = the heading colour. Lines at 96% (one group, so overlaps don't darken); the lilac parts (outer line + petals) are their own
     sub-group so they can be dimmed separately (opacity on that <g>). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <g id="petals" fill="rgb(197,138,249)">
      <circle cx="3" cy="0" r="2.7"/>
      <circle cx="-3" cy="0" r="2.7"/>
      <circle cx="0" cy="3" r="2.7"/>
      <circle cx="0" cy="-3" r="2.7"/>
    </g>
  </defs>
  <g opacity="0.96" fill="none">
    <!-- lilac: outer line + corner petals -->
    <g>
      <rect x="6" y="6" width="36" height="36" stroke="rgb(197,138,249)" stroke-width="3"/>
      <use href="#petals" x="6" y="6"/>
      <use href="#petals" x="42" y="6"/>
      <use href="#petals" x="42" y="42"/>
      <use href="#petals" x="6" y="42"/>
    </g>
    <!-- orange: inner line (7.5-9.5) butted right against the lilac line (4.5-7.5), no gap + flower centres -->
    <rect x="8.5" y="8.5" width="31" height="31" rx="1.5" stroke="rgb(255,144,84)" stroke-width="2"/>
    <g fill="rgb(255,144,84)">
      <circle cx="6" cy="6" r="1.6"/>
      <circle cx="42" cy="6" r="1.6"/>
      <circle cx="42" cy="42" r="1.6"/>
      <circle cx="6" cy="42" r="1.6"/>
    </g>
  </g>
</svg>
