<!-- wire-frame.svg plus the panel fill (96% bgAqua), for the wide layout's panels (styles.css; border-image `fill`, so
     the middle slice paints too). The fill runs from the line's centre inwards, under the line. Keep in sync with
     wire-frame.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <g id="petals" fill="rgb(197,138,249)">
      <circle cx="6" cy="0" r="5.4"/>
      <circle cx="-6" cy="0" r="5.4"/>
      <circle cx="0" cy="6" r="5.4"/>
      <circle cx="0" cy="-6" r="5.4"/>
    </g>
  </defs>
  <rect x="11.5" y="11.5" width="41" height="41" fill="rgba(11,54,91,0.96)"/>
  <!-- the line: lilac, see-through (stroke-opacity, one shape, so it never darkens against itself) -->
  <rect x="11.5" y="11.5" width="41" height="41" fill="none" stroke="rgb(197,138,249)" stroke-opacity="0.77" stroke-width="4"/>
  <!-- the corner flowers: fully opaque, drawn over the line -->
  <use href="#petals" x="11.5" y="11.5"/>
  <use href="#petals" x="52.5" y="11.5"/>
  <use href="#petals" x="52.5" y="52.5"/>
  <use href="#petals" x="11.5" y="52.5"/>
  <!-- orange flower centres: the heading text colour (rgb 255,144,84), fully opaque -->
  <g fill="rgb(255,144,84)">
    <circle cx="11.5" cy="11.5" r="3.2"/>
    <circle cx="52.5" cy="11.5" r="3.2"/>
    <circle cx="52.5" cy="52.5" r="3.2"/>
    <circle cx="11.5" cy="52.5" r="3.2"/>
  </g>
</svg>
