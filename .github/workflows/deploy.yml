name: Build and deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vendor/movement-map is a git submodule of a private repo, so the default GITHUB_TOKEN can't fetch it. A read-only
      # deploy key on ali-layken/movement-map (private half in the MOVEMENT_MAP_DEPLOY_KEY secret) is used for that one fetch.
      - name: Fetch the movement-map submodule
        env:
          DEPLOY_KEY: ${{ secrets.MOVEMENT_MAP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mm_key && chmod 600 ~/.ssh/mm_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/mm_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git -c url."git@github.com:ali-layken/movement-map".insteadOf="https://github.com/ali-layken/movement-map" \
            submodule update --init --depth 1 vendor/movement-map
          rm -f ~/.ssh/mm_key

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # SITE_ORIGIN is a repository *variable* (Settings -> Secrets and
      # variables -> Actions -> Variables). Leave it unset to use the
      # default in src/lib/site.mjs.
      - name: Build
        run: npm run build
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

      # Pull requests only build (a broken build fails the check); the
      # deploy itself happens on push to main.
      #
      # Skipped (not failed) while the CLOUDFLARE_API_TOKEN secret is unset,
      # so the repo can still be deployed by hand with `npm run deploy`.
      - name: Deploy
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
