<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DoopWatcher - Twitch Login</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #18181b;
      color: #efeff1;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .msg { max-width: 320px; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="msg" id="msg">Signing you in&hellip;</div>
  <script>
    // Twitch's implicit-grant response lands in the URL hash (#access_token=...)
    // and never reaches any server, so this page's only job is to read it
    // client-side and hand it to the app via its registered custom protocol.
    var APP_SCHEME = "doopwatcher-twitch";
    var hash = window.location.hash; // includes leading '#', e.g. "#access_token=...&scope=&token_type=bearer"
    var search = window.location.search; // top-level errors (e.g. access_denied) arrive as query params

    var msgEl = document.getElementById("msg");

    if (hash && hash.indexOf("access_token=") !== -1) {
      window.location.replace(APP_SCHEME + "://login" + hash);
      msgEl.textContent = "Signed in - you can close this window.";
    } else if (search && search.indexOf("error=") !== -1) {
      window.location.replace(APP_SCHEME + "://login" + search);
      msgEl.textContent = "Login failed - you can close this window.";
      msgEl.className = "err";
    } else {
      msgEl.textContent = "No login info found. You can close this window and try again from the app.";
      msgEl.className = "err";
    }
  </script>
</body>
</html>
